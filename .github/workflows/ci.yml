name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: |
          mkdir -p .ci-logs
          pnpm typecheck 2>&1 | tee .ci-logs/typecheck.log

      - name: Test
        run: pnpm test 2>&1 | tee .ci-logs/test.log

      - name: Build
        run: pnpm build 2>&1 | tee .ci-logs/build.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: .ci-logs
          if-no-files-found: ignore
          retention-days: 3
