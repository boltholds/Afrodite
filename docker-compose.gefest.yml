services:
  target-preview:
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${GEFEST_API_PORT:-8000}
    depends_on:
      gefest-api:
        condition: service_healthy

  gefest-api:
    build:
      context: "${AFRODITE_TARGET_PROJECT:?AFRODITE_TARGET_PROJECT is required}/backend"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GEFEST_POSTGRES_DB:-gefest}
      POSTGRES_USER: ${GEFEST_POSTGRES_USER:-gefest}
      POSTGRES_PASSWORD: ${GEFEST_POSTGRES_PASSWORD:-gefest}
      POSTGRES_HOST: gefest-postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://gefest-redis:6379/0
      S3_ENDPOINT_URL: http://gefest-minio:9000
      S3_ACCESS_KEY_ID: ${GEFEST_S3_ACCESS_KEY_ID:-gefest}
      S3_SECRET_ACCESS_KEY: ${GEFEST_S3_SECRET_ACCESS_KEY:-gefest-secret}
      S3_BUCKET: ${GEFEST_S3_BUCKET:-gefest-projects}
      BACKEND_CORS_ORIGINS: http://localhost:${AFRODITE_TARGET_PREVIEW_PORT:-3000},http://127.0.0.1:${AFRODITE_TARGET_PREVIEW_PORT:-3000}
      SOLVER_URL: http://gefest-solver:8010
    depends_on:
      gefest-postgres:
        condition: service_healthy
      gefest-redis:
        condition: service_healthy
      gefest-minio:
        condition: service_started
      gefest-solver:
        condition: service_started
    ports:
      - "127.0.0.1:${GEFEST_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  gefest-solver:
    build:
      context: "${AFRODITE_TARGET_PROJECT:?AFRODITE_TARGET_PROJECT is required}/solver-core"
    restart: unless-stopped
    environment:
      SOLVER_HOST: 0.0.0.0
      SOLVER_PORT: 8010
    ports:
      - "127.0.0.1:${GEFEST_SOLVER_PORT:-8010}:8010"

  gefest-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GEFEST_POSTGRES_DB:-gefest}
      POSTGRES_USER: ${GEFEST_POSTGRES_USER:-gefest}
      POSTGRES_PASSWORD: ${GEFEST_POSTGRES_PASSWORD:-gefest}
    volumes:
      - gefest-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U ${GEFEST_POSTGRES_USER:-gefest} -d ${GEFEST_POSTGRES_DB:-gefest}
      interval: 5s
      timeout: 5s
      retries: 30

  gefest-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  gefest-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${GEFEST_S3_ACCESS_KEY_ID:-gefest}
      MINIO_ROOT_PASSWORD: ${GEFEST_S3_SECRET_ACCESS_KEY:-gefest-secret}
    volumes:
      - gefest-minio-data:/data

volumes:
  gefest-postgres-data:
  gefest-minio-data:
